[project]
name = "revops-ai"
version = "0.1.0a0"
description = "An extensible SDK for building auditable, write-safe RevOps AI agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "revops-ai contributors" }]
keywords = ["revops", "agents", "llm", "gtm", "crm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "pydantic-ai-slim>=1.0",
]

[project.optional-dependencies]
openai = ["pydantic-ai-slim[openai]>=1.0"]
anthropic = ["pydantic-ai-slim[anthropic]>=1.0"]
hubspot = ["hubspot-api-client>=8.0"]
salesforce = ["simple-salesforce>=1.12"]
stripe = ["stripe>=10.0"]
warehouse = ["sqlalchemy>=2.0"]
server = ["fastapi>=0.110", "uvicorn>=0.29"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "respx>=0.21",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/revops_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = "src"
packages = ["revops_ai"]
